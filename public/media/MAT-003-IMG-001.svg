<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Como escolher o método na regra de três</title><desc id="desc">Verifique a proporcionalidade. Se não houver, não use regra de três. Se houver, use regra simples para duas grandezas ou composta para três ou mais.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49647e"/></marker></defs><rect width="960" height="520" rx="24" fill="#f5f8fc"/><text x="480" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d">Como escolher o método</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="330" y="78" width="300" height="76" rx="14" fill="#fff" stroke="#49647e" stroke-width="3"/><text x="480" y="123" font-size="22" font-weight="700" fill="#17324d">Há proporcionalidade?</text><path d="M330 116 H190 V204" fill="none" stroke="#49647e" stroke-width="3" marker-end="url(#arrow)"/><text x="242" y="105" font-size="18" fill="#17324d">Não</text><path d="M630 116 H770 V204" fill="none" stroke="#49647e" stroke-width="3" marker-end="url(#arrow)"/><text x="716" y="105" font-size="18" fill="#17324d">Sim</text><rect x="55" y="216" width="270" height="90" rx="14" fill="#fff3ee" stroke="#b45a3c" stroke-width="3"/><text x="190" y="254" font-size="20" font-weight="700" fill="#77351f">Não use regra de três</text><text x="190" y="282" font-size="16" fill="#77351f">Modele a relação adequada</text><rect x="635" y="216" width="270" height="90" rx="14" fill="#fff" stroke="#49647e" stroke-width="3"/><text x="770" y="254" font-size="20" font-weight="700" fill="#17324d">Quantas grandezas?</text><text x="770" y="282" font-size="16" fill="#344c62">Duas ou três e mais?</text><path d="M735 306 V350 H480 V382" fill="none" stroke="#49647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M805 306 V350 H820 V382" fill="none" stroke="#49647e" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="342" font-size="17" fill="#17324d">Duas</text><text x="857" y="342" font-size="17" fill="#17324d">Três ou mais</text><rect x="325" y="390" width="310" height="90" rx="14" fill="#e8f2ff" stroke="#396e9f" stroke-width="3"/><text x="480" y="428" font-size="20" font-weight="700" fill="#17324d">Regra simples</text><text x="480" y="456" font-size="16" fill="#344c62">Classifique: direta ou inversa</text><rect x="680" y="390" width="280" height="90" rx="14" fill="#e8f2ff" stroke="#396e9f" stroke-width="3"/><text x="820" y="428" font-size="20" font-weight="700" fill="#17324d">Regra composta</text><text x="820" y="456" font-size="16" fill="#344c62">Analise cada grandeza</text></g></svg>