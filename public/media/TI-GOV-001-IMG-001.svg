<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">ITIL e COBIT: papéis complementares</title><desc id="d">COBIT organiza governança e gestão de informação e tecnologia; ITIL orienta gerenciamento de serviços e cocriação de valor. São complementares, mas não equivalentes.</desc><rect width="1000" height="600" rx="28" fill="#f5f8fc"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">Governança e gestão de serviços de TI</text><rect x="75" y="115" width="385" height="300" rx="22" fill="#e7f0fb" stroke="#416c9b" stroke-width="4"/><text x="267" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324d">COBIT 2019</text><text x="267" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#244762">Governança e gestão</text><text x="267" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#244762">de informação e tecnologia</text><text x="267" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244762">Direção • objetivos • componentes</text><text x="267" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244762">Desempenho • fatores de desenho</text><rect x="540" y="115" width="385" height="300" rx="22" fill="#e8f5ef" stroke="#438365" stroke-width="4"/><text x="732" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324d">ITIL 4</text><text x="732" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#244762">Gerenciamento de serviços</text><text x="732" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#244762">e cocriação de valor</text><text x="732" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244762">SVS • princípios orientadores</text><text x="732" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244762">Dimensões • cadeia • práticas</text><rect x="315" y="475" width="370" height="80" rx="18" fill="#fff" stroke="#7b638c" stroke-width="4"/><text x="500" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#453354">Focos complementares</text><text x="500" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#453354">sem equivalência ou substituição automática</text><path d="M267 415 V455 H395 V475 M732 415 V455 H605 V475" fill="none" stroke="#64758a" stroke-width="4"/></svg>