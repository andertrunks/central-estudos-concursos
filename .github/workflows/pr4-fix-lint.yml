name: PR-4 apply validation fixes
on:
  push:
    branches: [chore/pr4-sync-engine]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr4-sync-engine
      - name: Apply narrow lint fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/cloud-protocol.ts')
          text = p.read_text()
          old = '''    case "activities": {
                const parsed = activitySchema.parse(value);
                const { sequence: _sequence, ...projected } = parsed;
                return activityCloudSchema.parse(projected);
              }'''.replace('              ', '')
          new = '''    case "activities": return activityCloudSchema.parse(activitySchema.parse(value));'''
          if old not in text:
              raise SystemExit('protocol replacement target not found')
          p.write_text(text.replace(old, new))

          p = Path('tests/cloud-sync-engine.test.ts')
          text = p.read_text()
          old = '''    let token = "old-token";
              token = "new-token";
              expect(token).toBe("new-token");'''.replace('              ', '')
          new = '''    const tokenBefore = "old-token";
              const tokenAfter = "new-token";
              expect(tokenBefore).not.toBe(tokenAfter);'''.replace('              ', '')
          if old not in text:
              raise SystemExit('test replacement target not found')
          p.write_text(text.replace(old, new))
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr4-fix-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/cloud-protocol.ts tests/cloud-sync-engine.test.ts .github/workflows/pr4-fix-lint.yml
          git commit -m "fix(pr4): satisfy initial lint gates"
          git push origin HEAD:chore/pr4-sync-engine
