name: Cloud schema validation
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/cloud-schema.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/cloud-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start disposable local Supabase
        run: supabase start --exclude studio,mail,realtime,storage,functions,analytics,pooler
      - name: Replay migrations from scratch
        run: supabase db reset
      - name: Run database tests
        run: supabase test db
      - name: Lint database
        run: supabase db lint --level error
      - name: Destroy disposable local Supabase
        if: always()
        run: supabase stop --no-backup
