name: PR-2 lockfile bootstrap
on:
  push:
    branches: [chore/pr2-auth-shell]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr2-auth-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinned lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install
        run: npm ci --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(pr2): synchronize Supabase lockfile"
          git push origin HEAD:chore/pr2-auth-shell
