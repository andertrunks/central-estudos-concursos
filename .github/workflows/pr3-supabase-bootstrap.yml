name: PR-3 Supabase scaffold bootstrap
on:
  push:
    branches: [chore/pr3-cloud-schema]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr3-cloud-schema
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate local Supabase scaffold and migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          mkdir -p supabase/migrations
          if ! compgen -G 'supabase/migrations/*_pr3_cloud_schema.sql' > /dev/null; then
            supabase migration new pr3_cloud_schema
          fi
      - name: Commit generated scaffold when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/ && [ -z "$(git ls-files --others --exclude-standard supabase/)" ]; then
            echo "Supabase scaffold already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/
          git commit -m "chore(pr3): bootstrap local Supabase migration scaffold"
          git push origin HEAD:chore/pr3-cloud-schema
