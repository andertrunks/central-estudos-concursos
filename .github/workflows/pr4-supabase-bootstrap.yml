name: PR-4 Supabase writer bootstrap
on:
  push:
    branches: [chore/pr4-sync-engine]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr4-sync-engine
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Generate migration and Edge Function scaffold
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new pr4_sync_writer
          if [ ! -d supabase/functions/cloud-sync-write ]; then
            supabase functions new cloud-sync-write
          fi
      - name: Commit generated scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations supabase/functions
          git commit -m "chore(pr4): generate sync writer scaffold"
          git push origin HEAD:chore/pr4-sync-engine
