name: PR-4 apply SQL test type casts
on:
  push:
    branches: [chore/pr4-sync-engine]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr4-sync-engine
      - name: Add explicit PostgreSQL casts in request-hash fixtures
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/tests/database/pr4_sync_writer.test.sql')
          text = p.read_text()
          replacements = {
              ",'upsert',1,0,": ",'upsert',1::smallint,0::bigint,",
              ",'upsert',1,1,": ",'upsert',1::smallint,1::bigint,",
              ",'upsert',1,2,": ",'upsert',1::smallint,2::bigint,",
              ",'delete',1,2,": ",'delete',1::smallint,2::bigint,",
          }
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              raise SystemExit('no request-hash fixture targets found')
          p.write_text(text)
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr4-fix-sql-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/pr4_sync_writer.test.sql .github/workflows/pr4-fix-sql-types.yml
          git commit -m "fix(pr4): type SQL request-hash fixtures explicitly"
          git push origin HEAD:chore/pr4-sync-engine
