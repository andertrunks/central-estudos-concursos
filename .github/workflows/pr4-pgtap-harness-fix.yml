# One-shot branch repair workflow. Remove after the bot commits the test fix.
name: PR-4 pgTAP harness fix
on:
  push:
    branches: [chore/pr4-sync-engine]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr4-sync-engine
      - name: Fix pgTAP plan and temp fixture ACL
        shell: python
        run: |
          from pathlib import Path
          p = Path("supabase/tests/database/pr4_sync_writer.test.sql")
          text = p.read_text()
          assert text.count("select plan(24);") == 1
          text = text.replace("select plan(24);", "select plan(27);", 1)
          marker = "));\nset local role service_role;\nselect throws_ok("
          replacement = "));\ngrant select on table pr4_invalid_batches to service_role;\nset local role service_role;\nselect throws_ok("
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)
          p.write_text(text)
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/pr4_sync_writer.test.sql
          git diff --cached --quiet && exit 0
          git commit -m "test(pr4): fix pgTAP plan and temp fixture ACL"
          git push origin HEAD:chore/pr4-sync-engine
