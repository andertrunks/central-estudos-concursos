name: PR-4 compact SQL fix v2
on:
  push:
    branches: [chore/pr4-sync-engine]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pr4-sync-engine
      - name: Fix exact bbbb and cccc writer statements
        shell: python
        run: |
          from pathlib import Path
          p = Path("supabase/tests/database/pr4_sync_writer.test.sql")
          text = p.read_text()
          for mutation_id in [
            "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb",
            "cccccccc-cccc-4ccc-8ccc-cccccccccccc",
          ]:
            needle = "'requestHash', public.central_cloud_request_hash('" + mutation_id
            start = text.index(needle)
            close = text.index("\n  ));", start)
            next_reset = text.index("reset role;", start)
            assert close < next_reset
            text = text[:close] + "\n  )));" + text[close + len("\n  ));"):]
          p.write_text(text)
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/pr4_sync_writer.test.sql
          git diff --cached --quiet && exit 0
          git commit -m "test(pr4): close compact writer calls correctly"
          git push origin HEAD:chore/pr4-sync-engine
