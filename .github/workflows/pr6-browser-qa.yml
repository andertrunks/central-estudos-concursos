name: PR-6 isolated browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr6-browser-qa.yml"
      - "tests/pr6-browser.e2e.ts"
      - "src/services/writing-conflict-commit.ts"
      - "src/services/cloud-sync-engine.ts"
      - "src/components/CloudConflictPanel.tsx"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CLOUD_MODE: "off"
      SITE_URL: "http://127.0.0.1:4174/central-estudos-concursos/"
      OUTPUT_DIR: "test-results/pr6-browser"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Install disposable Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build with cloud transport disabled
        run: npm run build
      - name: Start local preview (never production)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/pr6-vite-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null "$SITE_URL"; then exit 0; fi
            sleep 2
          done
          cat /tmp/pr6-vite-preview.log
          exit 1
      - name: Browser smoke + WCAG axe + local Writing persistence
        run: node --import tsx tests/pr6-browser.e2e.ts
      - name: Upload isolated QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6-browser-qa
          path: test-results/pr6-browser/
          if-no-files-found: ignore
          retention-days: 14
